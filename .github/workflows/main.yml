name: Build latest and push to `public` branch

on:
  push:
    branches: [ "src" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out src branch
        uses: actions/checkout@v7
        with:
          ref: "src"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: Build pages
        env:
          SPHINXOPTS: "-W"  # Turns all warnings into errors
        run: |
            cd src
            poetry run ablog build

      - uses: actions/upload-artifact@v7
        with:
          name: site_files
          path: build


  push-to-public:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out public branch
        uses: actions/checkout@v7
        with:
          ref: "public"

      - name: Setup git config
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"

      - name: Remove old files
        run: |
          git rm -rf docs/*

      - uses: actions/download-artifact@v8
        with:
          name: site_files
          path: docs/

      - name: Commit new files
        run: |
          git add .
          git restore --staged --worktree docs/CNAME
          git status
          git commit -m "Auto deploy `date -Idate`"
          git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: "pages"
      cancel-in-progress: false

    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site_files
          # _site is the default dir for uploading Pages artifacts
          # See: https://github.com/actions/upload-pages-artifact/blob/main/action.yml
          path: _site/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
